name: salon_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.4.3
  image_picker: ^1.2.2
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.0.1
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  image: ^4.3.0
  path_provider: ^2.1.4
  uuid: ^4.5.1
  http: ^1.6.0
  timezone: ^0.11.0
  firebase_crashlytics: ^5.2.7
  firebase_analytics: ^12.4.6
  firebase_app_check: ^0.4.6
  crypto: ^3.0.7
  firebase_messaging: ^16.5.0
  razorpay_flutter: ^1.4.5
  cloud_functions: ^6.3.6
  flutter_markdown_plus: ^1.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0175C2"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#0175C2"
    theme_color: "#0175C2"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/app_icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - docs/
